services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: docuask-app
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "${APP__PORT}:8000"

    volumes:
      - uploads:/app/uploads

    depends_on:
      migration:
        condition: service_completed_successfully

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  migration:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: docuask-migration
    restart: "no"

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]

  postgres:
    image: pgvector/pgvector:pg17

    container_name: docuask-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DATABASE__NAME}
      POSTGRES_USER: ${DATABASE__USER}
      POSTGRES_PASSWORD: ${DATABASE__PASSWORD}

    ports:
      - "${DATABASE__PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${DATABASE__USER} -d ${DATABASE__NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.2.1

    container_name: docuask-redis
    restart: unless-stopped

    ports:
      - "${REDIS__PORT}:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  uploads:
