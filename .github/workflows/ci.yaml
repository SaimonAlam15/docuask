```yaml
name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: docuask
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d docuask"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8.2.1
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run migrations
        env:
          DATABASE__HOST: localhost
          DATABASE__PORT: 5432
          DATABASE__USER: postgres
          DATABASE__PASSWORD: postgres
          DATABASE__NAME: docuask
        run: uv run alembic upgrade head

      - name: Run tests
        env:
          DATABASE__HOST: localhost
          DATABASE__PORT: 5432
          DATABASE__USER: postgres
          DATABASE__PASSWORD: postgres
          DATABASE__NAME: docuask
          REDIS__HOST: localhost
          REDIS__PORT: 6379
        run: uv run pytest

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: docuask:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
```
